[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-studies"
version = "0.1.0"
description = "Tested building blocks for 13F holdings research: ownership overlap, data-quality checks and fuzzy company-name matching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Souparneya Chakrabarti" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "scipy>=1.11"]

[project.urls]
Repository = "https://github.com/SouparneyaC/quant-research-studies"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["studies"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E741", "B007"]
